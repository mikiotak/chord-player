<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コード＆メロディープレーヤー</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f4f6;margin:0;color:#111}
.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 8px rgba(0,0,0,.06)}
h1{font-size:27px;margin:6px 0}.sub,.note{color:#666;line-height:1.55}.sub{font-size:14px}.note{font-size:13px}
label{display:block;font-weight:700;margin:0 0 7px}
textarea,input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8d8dd;border-radius:12px;font:inherit;background:#fff}
textarea{min-height:105px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;padding:15px;border:0;border-radius:14px;font-size:17px;font-weight:700;margin-top:10px;background:#111;color:#fff}
button.secondary{background:#e9e9ed;color:#111}.checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.check{display:flex;align-items:center;gap:7px;font-weight:600}.check input{width:auto;transform:scale(1.25)}
#nowChord,#nowMelody{text-align:center;font-size:30px;font-weight:800;padding:5px}.nowLabel{text-align:center;font-size:12px;color:#777;margin-top:8px}
#status{text-align:center;color:#666;font-size:14px;margin-top:8px}.error{color:#b00020;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>🎼 コード＆メロディープレーヤー</h1>
<div class="sub">曲集から選ぶことも、自分でコードとメロディーを入力することもできます。</div>

<div class="card">
<label>🎼 曲集から選ぶ</label>
<select id="librarySongs">
<option value="">曲を選んでください</option>
<option value="saints">聖者の行進</option>
<option value="twinkle">きらきら星</option>
<option value="ode">喜びの歌</option>
<option value="mary">メリーさんのひつじ</option>
<option value="frere">フレール・ジャック</option>
<option value="london">ロンドン橋</option>
<option value="row">Row, Row, Row Your Boat</option>
<option value="amazing">アメイジング・グレイス</option>
<option value="auld">蛍の光</option>
<option value="greensleeves">グリーンスリーブス</option>
</select>
<button id="loadLibrarySong">🎵 この曲を読み込む</button>
<div class="note">伝承曲・古典曲を、このアプリ用に簡易アレンジしています。</div>
</div>

<div class="card"><label>曲名</label><input id="songName" placeholder="例：朝顔の歌"></div>

<div class="card">
<label>コード進行</label>
<textarea id="chords">F6 | Am7 | Bbmaj7 | C7
Dm7 | Gm7 | C7 | F6</textarea>
<div class="note">例：F6 | Gm7 | C7 | F6　拍数指定：F6:4 Gm7:2 C7:2 F6:4</div>
</div>

<div class="card">
<label>メロディー</label>
<textarea id="melody">A4 G4 F4 A4 | C5 Bb4 A4 G4
F4 A4 G4 F4 | E4 G4 F4:2</textarea>
<div class="note">A4:2＝2拍、F#4・Bb4対応、R＝休符</div>
<div id="error" class="error"></div>
</div>

<div class="card">
<div class="grid">
<div><label>BPM</label><input id="bpm" type="number" min="30" max="240" value="84"></div>
<div><label>コード標準拍数</label><select id="beats"><option value="1">1拍</option><option value="2">2拍</option><option value="4" selected>4拍</option><option value="8">8拍</option></select></div>
</div>
<label style="margin-top:14px">伴奏スタイル</label>
<select id="style"><option value="block">🎵 ジャーン</option><option value="arp">🎶 アルペジオ</option><option value="piano">🎹 ピアノ伴奏風</option></select>
<div class="checks">
<label class="check"><input type="checkbox" id="playChords" checked>伴奏</label>
<label class="check"><input type="checkbox" id="playMelody" checked>メロディー</label>
<label class="check"><input type="checkbox" id="loop">繰り返し</label>
</div>
<button id="test" class="secondary">🔊 テスト音</button>
<button id="play">▶ 再生</button>
<button id="stop" class="secondary">■ 停止</button>
</div>

<div class="card">
<label>曲の保存</label>
<button id="saveSong">💾 この曲を保存</button>
<select id="savedSongs" style="margin-top:10px"><option value="">保存した曲を選択</option></select>
<button id="loadSong" class="secondary">📂 呼び出す</button>
<button id="deleteSong" class="secondary">🗑 保存曲を削除</button>
</div>

<div class="card">
<div class="nowLabel">コード</div><div id="nowChord">—</div>
<div class="nowLabel">メロディー</div><div id="nowMelody">—</div>
<div id="status">停止中</div>
</div>
</div>

<script>
let ctx=null,master=null,timers=[],nodes=[],playing=false;
const N={"C":0,"C#":1,"DB":1,"D":2,"D#":3,"EB":3,"E":4,"F":5,"F#":6,"GB":6,"G":7,"G#":8,"AB":8,"A":9,"A#":10,"BB":10,"B":11};
const TYPES=[[/^maj7$/i,[0,4,7,11]],[/^m7$/i,[0,3,7,10]],[/^7$/i,[0,4,7,10]],[/^m6$/i,[0,3,7,9]],[/^6$/i,[0,4,7,9]],[/^m$/i,[0,3,7]],[/^sus4$/i,[0,5,7]],[/^sus2$/i,[0,2,7]],[/^add9$/i,[0,4,7,14]],[/^dim$/i,[0,3,6]],[/^aug$/i,[0,4,8]],[/^$/,[0,4,7]]];

const SONGBOOK={
saints:{name:"聖者の行進",bpm:116,style:"piano",chords:"C:4 | C:4 | C:4 | C:4 | F:4 | C:4 | G7:4 | C:4",melody:"C4 E4 F4 G4 | C4 E4 F4 G4 | C4 E4 F4 G4 | E4 C4 E4 D4 | E4 E4 D4 C4 | C4 E4 G4 G4 | F4 E4 D4 G4 | E4 D4 C4:2 R:2"},
twinkle:{name:"きらきら星",bpm:100,style:"block",chords:"C:8 | F:8 | G7:8 | C:8",melody:"C4 C4 G4 G4 A4 A4 G4:2 | F4 F4 E4 E4 D4 D4 C4:2 | G4 G4 F4 F4 E4 E4 D4:2 | G4 G4 F4 F4 E4 E4 D4:2"},
ode:{name:"喜びの歌",bpm:110,style:"piano",chords:"C:4 | G7:4 | C:4 | G7:4 | C:4 | F:4 | G7:4 | C:4",melody:"E4 E4 F4 G4 | G4 F4 E4 D4 | C4 C4 D4 E4 | E4:2 D4 D4 | E4 E4 F4 G4 | G4 F4 E4 D4 | C4 C4 D4 E4 | D4:2 C4:2"},
mary:{name:"メリーさんのひつじ",bpm:105,style:"block",chords:"C:4 | G7:4 | C:4 | G7:4 | C:4 | C:4",melody:"E4 D4 C4 D4 | E4 E4 E4:2 | D4 D4 D4:2 | E4 G4 G4:2 | E4 D4 C4 D4 | E4 E4 E4 E4"},
frere:{name:"フレール・ジャック",bpm:105,style:"arp",chords:"C:4 | C:4 | C:4 | C:4 | C:4 | G7:4 | C:4 | C:4",melody:"C4 D4 E4 C4 | C4 D4 E4 C4 | E4 F4 G4:2 | E4 F4 G4:2 | G4 A4 G4 F4 | E4 C4 G4:2 | C4 G3 C4:2 | C4:4"},
london:{name:"ロンドン橋",bpm:110,style:"block",chords:"C:4 | G7:4 | C:4 | G7:4 | C:4 | G7:4 | C:4 | C:4",melody:"G4 A4 G4 F4 | E4 F4 G4:2 | D4 E4 F4:2 | E4 F4 G4:2 | G4 A4 G4 F4 | E4 F4 G4:2 | D4 G4 E4 C4 | C4:4"},
row:{name:"Row, Row, Row Your Boat",bpm:100,style:"arp",chords:"C:4 | C:4 | C:4 | G7:4 | C:4 | G7:4 | C:4 | C:4",melody:"C4:1.5 C4:1.5 C4:1 | D4 E4:2 | E4 D4 E4 F4 | G4:4 | C5 C5 C5 G4 | G4 G4 E4 E4 | C4 G4 F4 E4 | D4 C4:3"},
amazing:{name:"アメイジング・グレイス",bpm:72,style:"piano",chords:"C:4 | F:4 | C:4 | G7:4 | C:4 | F:4 | C:4 | G7:4",melody:"G4 C5:2 E5 | C5:2 E5 D5 | C5:2 A4 G4 | G4:2 C5:2 | E5:2 C5 E5 | D5:2 G4:2 | C5:2 A4 G4 | C5:4"},
auld:{name:"蛍の光",bpm:82,style:"piano",chords:"C:4 | G7:4 | C:4 | F:4 | C:4 | G7:4 | C:4 | C:4",melody:"G4 C5:1.5 C5:.5 C5 | E5 D5:1.5 C5:.5 D5 | E5 C5 C5 E5 | G5:2 A5 G5 | E5 E5 C5 D5 | E5 D5 C5 A4 | G4 C5 E5 D5 | C5:4"},
greensleeves:{name:"グリーンスリーブス",bpm:88,style:"arp",chords:"Am:4 | G:4 | Am:4 | E7:4 | Am:4 | G:4 | F:4 | E7:4",melody:"A4 C5:2 D5 | E5:1.5 F5:.5 E5 D5 | B4 G4:2 A4 | B4 E4:3 | A4 C5:2 D5 | E5:1.5 F5:.5 E5 D5 | B4 G#4 A4:2 | A4:4"}
};

async function initAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error("このブラウザは音声再生に対応していません。");if(!ctx){ctx=new AC();master=ctx.createGain();master.gain.value=.42;master.connect(ctx.destination)}if(ctx.state!=="running")await ctx.resume()}
function freq(m){return 440*Math.pow(2,(m-69)/12)}
function tone(f,start,dur,volume=.15,type="triangle"){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(volume,start+.015);g.gain.exponentialRampToValueAtTime(.0001,start+Math.max(.05,dur));o.connect(g);g.connect(master);o.start(start);o.stop(start+dur+.05);nodes.push(o)}
function parseChord(s){s=s.trim().replace(/♭/g,"b").replace(/♯/g,"#");const m=s.match(/^([A-Ga-g])([#b]?)(.*)$/);if(!m)throw new Error("コードを読めません: "+s);const root=(m[1].toUpperCase()+m[2]).toUpperCase();if(!(root in N))throw new Error("コードを読めません: "+s);let suffix=m[3].trim().replace(/^M7$/,"maj7");for(const [r,ints] of TYPES)if(r.test(suffix))return{symbol:s,root:N[root],ints};throw new Error("未対応コード: "+s)}
function parseChordSeq(text,defBeats){return text.replace(/\n/g," | ").split(/\s*\|\s*|\s+/).filter(Boolean).map(token=>{let beats=defBeats;const x=token.match(/^(.*?):(\d*\.?\d+)$/);if(x){token=x[1];beats=Number(x[2])}return{...parseChord(token),beats}})}
function parseMelodyNote(token){let beats=1;const d=token.match(/^(.*?):(\d*\.?\d+)$/);if(d){token=d[1];beats=Number(d[2])}if(/^R$/i.test(token))return{symbol:"R",rest:true,beats};token=token.replace(/♭/g,"b").replace(/♯/g,"#");const m=token.match(/^([A-Ga-g])([#b]?)(-?\d)$/);if(!m)throw new Error("メロディー音を読めません: "+token);const name=(m[1].toUpperCase()+m[2]).toUpperCase();if(!(name in N))throw new Error("メロディー音を読めません: "+token);return{symbol:token,rest:false,beats,midi:12*(Number(m[3])+1)+N[name]}}
function parseMelody(text){return text.replace(/\n/g," ").replace(/\|/g," ").split(/\s+/).filter(Boolean).map(parseMelodyNote)}
function blockChord(ch,start,dur){const base=60+ch.root;ch.ints.forEach(i=>tone(freq(base+i),start,dur*.92,.13,"triangle"))}
function arpeggioChord(ch,start,dur){const base=60+ch.root,notes=ch.ints.map(i=>base+i),count=Math.max(1,Math.round(dur/.35)),step=dur/count;for(let i=0;i<count;i++)tone(freq(notes[i%notes.length]),start+i*step,Math.min(step*.82,.55),.18,"triangle")}
function pianoChord(ch,start,dur){const base=60+ch.root;tone(freq(base-12),start,Math.min(dur*.85,1.2),.19,"sine");const notes=ch.ints.map(i=>base+i),pulse=Math.min(.5,dur/4);for(let t=0;t<dur-.05;t+=pulse)notes.forEach((m,i)=>tone(freq(m),start+t+i*.018,Math.min(pulse*.7,.38),.095,"triangle"))}
function scheduleChord(ch,start,dur,style){style==="arp"?arpeggioChord(ch,start,dur):style==="piano"?pianoChord(ch,start,dur):blockChord(ch,start,dur)}
function melodyTone(note,start,dur){if(!note.rest)tone(freq(note.midi),start,dur*.88,.23,"sine")}
function clearPlayback(){timers.forEach(clearTimeout);timers=[];nodes.forEach(n=>{try{n.stop()}catch(e){}});nodes=[]}
function stopAll(){
playing=false;

if(master && ctx){
try{
master.gain.cancelScheduledValues(ctx.currentTime);
master.gain.setValueAtTime(0.0001,ctx.currentTime);
}catch(e){}
}

clearPlayback();

document.getElementById("nowChord").textContent="—";
document.getElementById("nowMelody").textContent="—";
document.getElementById("status").textContent="停止中";

if(master && ctx){
try{
master.gain.setValueAtTime(.42,ctx.currentTime+.05);
}catch(e){}
}
}

async function startPlayback(){
stopAll();error.textContent="";
try{
await initAudio();
const bpm=Number(document.getElementById("bpm").value),defBeats=Number(beats.value),styleVal=style.value,useChords=playChords.checked,useMelody=playMelody.checked;
if(!useChords&&!useMelody)throw new Error("伴奏またはメロディーを選択してください。");
const beatSec=60/bpm,startTime=ctx.currentTime+.1;
let chordSeconds=0,melodySeconds=0;
if(useChords){
let pos=0;
parseChordSeq(chords.value,defBeats).forEach(ch=>{const dur=ch.beats*beatSec;scheduleChord(ch,startTime+pos,dur,styleVal);timers.push(setTimeout(()=>{if(playing)nowChord.textContent=ch.symbol},100+pos*1000));pos+=dur});
chordSeconds=pos;
}
if(useMelody){
let pos=0;
parseMelody(melody.value).forEach(n=>{const dur=n.beats*beatSec;melodyTone(n,startTime+pos,dur);timers.push(setTimeout(()=>{if(playing)nowMelody.textContent=n.rest?"休符":n.symbol},100+pos*1000));pos+=dur});
melodySeconds=pos;
}
playing=true;status.textContent="再生中";
timers.push(setTimeout(()=>{if(!playing)return;if(loop.checked)startPlayback();else{playing=false;nowChord.textContent="—";nowMelody.textContent="—";status.textContent="再生終了"}},100+Math.max(chordSeconds,melodySeconds)*1000));
}catch(e){error.textContent=e.message}
}

document.getElementById("test").onclick=async()=>{
document.getElementById("error").textContent="";
try{
await initAudio();
const t=ctx.currentTime+.03;
[261.63,329.63,392].forEach(f=>tone(f,t,.7,.14));
tone(523.25,t+.8,.7,.23,"sine");
document.getElementById("status").textContent="テスト音を再生しました";
}catch(e){
document.getElementById("error").textContent=e.message;
}
};

document.getElementById("play").onclick=startPlayback;
document.getElementById("stop").onclick=stopAll;

loadLibrarySong.onclick=()=>{
const key=librarySongs.value;if(!key){alert("曲を選んでください。");return}
const s=SONGBOOK[key];songName.value=s.name;chords.value=s.chords;melody.value=s.melody;bpm.value=s.bpm;style.value=s.style;playChords.checked=true;playMelody.checked=true;loop.checked=false;status.textContent=s.name+" を読み込みました";
};

function getSongs(){try{return JSON.parse(localStorage.getItem("chordPlayerSongs"))||{}}catch{return{}}}
function saveSongs(s){localStorage.setItem("chordPlayerSongs",JSON.stringify(s))}
function updateSongList(){savedSongs.innerHTML='<option value="">保存した曲を選択</option>';const s=getSongs();Object.keys(s).sort().forEach(name=>{const op=document.createElement("option");op.value=name;op.textContent=name;savedSongs.appendChild(op)})}
saveSong.onclick=()=>{const name=songName.value.trim();if(!name){alert("曲名を入力してください。");return}const s=getSongs();s[name]={chords:chords.value,melody:melody.value,bpm:bpm.value,beats:beats.value,style:style.value};saveSongs(s);updateSongList();savedSongs.value=name;alert("保存しました。")};
loadSong.onclick=()=>{const name=savedSongs.value;if(!name)return;const s=getSongs()[name];if(!s)return;songName.value=name;chords.value=s.chords||"";melody.value=s.melody||"";bpm.value=s.bpm||84;beats.value=s.beats||4;style.value=s.style||"block"};
deleteSong.onclick=()=>{const name=savedSongs.value;if(!name)return;if(!confirm(`「${name}」を削除しますか？`))return;const s=getSongs();delete s[name];saveSongs(s);updateSongList()};
updateSongList();
</script>
</body>
</html>
