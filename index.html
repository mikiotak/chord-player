<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>コード＆メロディープレーヤー v3.4</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f4f6;margin:0;color:#111}
.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 8px rgba(0,0,0,.06)}
h1{font-size:27px;margin:6px 0}.sub,.note{color:#666;line-height:1.55}.sub{font-size:14px}.note{font-size:13px}
label{display:block;font-weight:700;margin:0 0 7px}
textarea,input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8d8dd;border-radius:12px;font:inherit;background:#fff}
textarea{min-height:105px;line-height:1.55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;padding:15px;border:0;border-radius:14px;font-size:17px;font-weight:700;margin-top:10px;background:#111;color:#fff}
button.secondary{background:#e9e9ed;color:#111}
.checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}.check{display:flex;align-items:center;gap:7px;font-weight:600}.check input{width:auto;transform:scale(1.25)}
#nowChord,#nowMelody{text-align:center;font-size:30px;font-weight:800;padding:5px}.nowLabel{text-align:center;font-size:12px;color:#777;margin-top:8px}
#status{text-align:center;color:#666;font-size:14px;margin-top:8px}.error{color:#b00020;font-size:13px;margin-top:8px;white-space:pre-wrap}
#debug{font-size:12px;white-space:pre-wrap;background:#f6f6f8;padding:10px;border-radius:10px;color:#444}
.ok{color:#176b3a}
</style>
</head>
<body>
<div class="wrap">
<h1>🎹 コード＆メロディープレーヤー v3.4</h1>
<div class="sub">iPhone動作確認を優先した診断版です。</div>

<div class="card">
<label>① まず音声テスト</label>
<button id="enableAudio" onclick="enableAudioNow()">🔊 音を有効にする</button>
<div id="audioStatus" class="note" style="margin-top:8px">押した瞬間に短い「ピー」という確認音が鳴ります。</div>
</div>

<div class="card">
<label>② 曲集から選ぶ</label>
<select id="librarySongs" onchange="loadLibrary(this.value)">
<option value="">曲を選んでください</option>
<option value="saints">聖者の行進</option>
<option value="twinkle">きらきら星</option>
<option value="ode">喜びの歌</option>
<option value="mary">メリーさんのひつじ</option>
<option value="frere">フレール・ジャック</option>
<option value="london">ロンドン橋</option>
<option value="row">Row, Row, Row Your Boat</option>
<option value="amazing">アメイジング・グレイス</option>
<option value="auld">蛍の光</option>
<option value="greensleeves">グリーンスリーブス</option>
</select>
<button onclick="loadLibrary(document.getElementById('librarySongs').value)">🎵 この曲を読み込む</button>
<div id="loadStatus" class="note" style="margin-top:8px">曲を選ぶとここに読み込み結果を表示します。</div>
</div>

<div class="card"><label>曲名</label><input id="songName"></div>
<div class="card"><label>コード進行</label><textarea id="chords"></textarea></div>
<div class="card"><label>メロディー</label><textarea id="melody"></textarea><div id="error" class="error"></div></div>

<div class="card">
<div class="grid">
<div><label>BPM</label><input id="bpm" type="number" min="30" max="240" value="84"></div>
<div><label>コード標準拍数</label><select id="beats"><option value="1">1拍</option><option value="2">2拍</option><option value="4" selected>4拍</option><option value="8">8拍</option></select></div>
</div>
<label style="margin-top:14px">伴奏スタイル</label>
<select id="style"><option value="block">🎵 ジャーン</option><option value="arp">🎶 アルペジオ</option><option value="piano">🎹 ピアノ伴奏風</option></select>
<label style="margin-top:14px">演奏フィール</label>
<select id="feel"><option value="straight">ストレート</option><option value="swing">スウィング</option></select>
<div class="checks">
<label class="check"><input type="checkbox" id="playChords" checked>伴奏</label>
<label class="check"><input type="checkbox" id="playMelody" checked>メロディー</label>
<label class="check"><input type="checkbox" id="loop">繰り返し</label>
</div>
<button id="test" class="secondary" onclick="testPiano()">🎹 ピアノ音テスト</button>
<button id="play" onclick="startPlayback()">▶ 再生</button>
<button id="stop" class="secondary" onclick="stopAll()">■ 停止</button>
</div>

<div class="card">
<div class="nowLabel">コード</div><div id="nowChord">—</div>
<div class="nowLabel">メロディー</div><div id="nowMelody">—</div>
<div id="status">停止中</div>
</div>

<div class="card">
<label>診断表示</label>
<div id="debug">ページを読み込みました。</div>
</div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
function log(s){$("debug").textContent += "\n"+s;}

const N={"C":0,"C#":1,"DB":1,"D":2,"D#":3,"EB":3,"E":4,"F":5,"F#":6,"GB":6,"G":7,"G#":8,"AB":8,"A":9,"A#":10,"BB":10,"B":11};
const TYPES=[[/^maj7$/i,[0,4,7,11]],[/^m7$/i,[0,3,7,10]],[/^7$/i,[0,4,7,10]],[/^m6$/i,[0,3,7,9]],[/^6$/i,[0,4,7,9]],[/^m$/i,[0,3,7]],[/^sus4$/i,[0,5,7]],[/^sus2$/i,[0,2,7]],[/^add9$/i,[0,4,7,14]],[/^dim$/i,[0,3,6]],[/^aug$/i,[0,4,8]],[/^$/,[0,4,7]]];

const SONGBOOK={
saints:{name:"聖者の行進",bpm:116,style:"piano",feel:"swing",chords:"C:4 | C:4 | C:4 | C:4 | F:4 | C:4 | G7:4 | C:4",melody:"C4 E4 F4 G4 | C4 E4 F4 G4 | C4 E4 F4 G4 | E4 C4 E4 D4 | E4 E4 D4 C4 | C4 E4 G4 G4 | F4 E4 D4 G4 | E4 D4 C4:2 R:2"},
twinkle:{name:"きらきら星",bpm:100,style:"block",feel:"straight",chords:"C:8 | F:8 | G7:8 | C:8",melody:"C4 C4 G4 G4 A4 A4 G4:2 | F4 F4 E4 E4 D4 D4 C4:2 | G4 G4 F4 F4 E4 E4 D4:2 | G4 G4 F4 F4 E4 E4 D4:2"},
ode:{name:"喜びの歌",bpm:110,style:"piano",feel:"straight",chords:"C:4 | G7:4 | C:4 | G7:4 | C:4 | F:4 | G7:4 | C:4",melody:"E4 E4 F4 G4 | G4 F4 E4 D4 | C4 C4 D4 E4 | E4:2 D4 D4 | E4 E4 F4 G4 | G4 F4 E4 D4 | C4 C4 D4 E4 | D4:2 C4:2"},
mary:{name:"メリーさんのひつじ",bpm:105,style:"block",feel:"straight",chords:"C:4 | G7:4 | C:4 | G7:4 | C:4 | C:4",melody:"E4 D4 C4 D4 | E4 E4 E4:2 | D4 D4 D4:2 | E4 G4 G4:2 | E4 D4 C4 D4 | E4 E4 E4 E4"},
frere:{name:"フレール・ジャック",bpm:105,style:"arp",feel:"straight",chords:"C:4 | C:4 | C:4 | C:4 | C:4 | G7:4 | C:4 | C:4",melody:"C4 D4 E4 C4 | C4 D4 E4 C4 | E4 F4 G4:2 | E4 F4 G4:2 | G4 A4 G4 F4 | E4 C4 G4:2 | C4 G3 C4:2 | C4:4"},
london:{name:"ロンドン橋",bpm:110,style:"block",feel:"straight",chords:"C:4 | G7:4 | C:4 | G7:4 | C:4 | G7:4 | C:4 | C:4",melody:"G4 A4 G4 F4 | E4 F4 G4:2 | D4 E4 F4:2 | E4 F4 G4:2 | G4 A4 G4 F4 | E4 F4 G4:2 | D4 G4 E4 C4 | C4:4"},
row:{name:"Row, Row, Row Your Boat",bpm:100,style:"arp",feel:"straight",chords:"C:4 | C:4 | C:4 | G7:4 | C:4 | G7:4 | C:4 | C:4",melody:"C4:1.5 C4:1.5 C4:1 | D4 E4:2 | E4 D4 E4 F4 | G4:4 | C5 C5 C5 G4 | G4 G4 E4 E4 | C4 G4 F4 E4 | D4 C4:3"},
amazing:{name:"アメイジング・グレイス",bpm:72,style:"piano",feel:"straight",chords:"C:4 | F:4 | C:4 | G7:4 | C:4 | F:4 | C:4 | G7:4",melody:"G4 C5:2 E5 | C5:2 E5 D5 | C5:2 A4 G4 | G4:2 C5:2 | E5:2 C5 E5 | D5:2 G4:2 | C5:2 A4 G4 | C5:4"},
auld:{name:"蛍の光",bpm:82,style:"piano",feel:"straight",chords:"C:4 | G7:4 | C:4 | F:4 | C:4 | G7:4 | C:4 | C:4",melody:"G4 C5:1.5 C5:.5 C5 | E5 D5:1.5 C5:.5 D5 | E5 C5 C5 E5 | G5:2 A5 G5 | E5 E5 C5 D5 | E5 D5 C5 A4 | G4 C5 E5 D5 | C5:4"},
greensleeves:{name:"グリーンスリーブス",bpm:88,style:"arp",feel:"straight",chords:"Am:4 | G:4 | Am:4 | E7:4 | Am:4 | G:4 | F:4 | E7:4",melody:"A4 C5:2 D5 | E5:1.5 F5:.5 E5 D5 | B4 G4:2 A4 | B4 E4:3 | A4 C5:2 D5 | E5:1.5 F5:.5 E5 D5 | B4 G#4 A4:2 | A4:4"}
};

function loadLibrary(key){
  log("曲選択: "+key);
  if(!key){$("loadStatus").textContent="曲を選んでください。";return;}
  const s=SONGBOOK[key];
  if(!s){$("loadStatus").textContent="曲データが見つかりません。";return;}
  $("songName").value=s.name;
  $("chords").value=s.chords;
  $("melody").value=s.melody;
  $("bpm").value=s.bpm;
  $("style").value=s.style;
  $("feel").value=s.feel;
  $("loadStatus").textContent="✅ 「"+s.name+"」を読み込みました。";
  $("loadStatus").className="note ok";
  $("status").textContent="曲を読み込みました";
  log("曲読み込み成功: "+s.name);
}

let ctx=null,master=null,audioEnabled=false,samplesReady=false;
const sampleBuffers=new Map();
const activeSources=[];
let timers=[],token=0,lastVoicing=null;

const SAMPLE_BASE="https://tonejs.github.io/audio/salamander/";
const SAMPLES=[{midi:48,file:"C3.mp3"},{midi:60,file:"C4.mp3"},{midi:72,file:"C5.mp3"}];

function createContextSync(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) throw new Error("Web Audio非対応");
  if(!ctx){
    ctx=new AC();
    master=ctx.createGain();
    master.gain.value=.75;
    master.connect(ctx.destination);
  }
  return ctx;
}

async function enableAudioNow(){
  try{
    const c=createContextSync();

    // IMPORTANT: audible oscillator is created immediately inside the tap handler.
    const osc=c.createOscillator();
    const g=c.createGain();
    osc.frequency.value=523.25;
    g.gain.value=.20;
    osc.connect(g);g.connect(master);
    osc.start();
    osc.stop(c.currentTime+.22);

    if(c.state==="suspended"){
      await c.resume();
    }

    audioEnabled=true;
    $("audioStatus").textContent="✅ 電子音を開始しました。ピアノ音源を準備中…";
    $("audioStatus").className="note ok";
    log("AudioContext state: "+c.state);

    await loadSamples();

    $("audioStatus").textContent="✅ 音声有効・ピアノ音源準備完了";
    $("enableAudio").textContent="✅ 音声有効";
    log("ピアノ音源準備完了");
  }catch(e){
    $("audioStatus").textContent="⚠️ "+e.message;
    $("error").textContent=e.stack||e.message;
    log("音声エラー: "+e.message);
  }
}

async function loadSamples(){
  if(samplesReady)return;
  for(const s of SAMPLES){
    const r=await fetch(SAMPLE_BASE+s.file,{mode:"cors",cache:"force-cache"});
    if(!r.ok)throw new Error("音源取得失敗 "+r.status);
    const ab=await r.arrayBuffer();
    const buf=await ctx.decodeAudioData(ab);
    sampleBuffers.set(s.midi,buf);
  }
  samplesReady=true;
}

function nearestSample(midi){
  return SAMPLES.reduce((best,s)=>Math.abs(s.midi-midi)<Math.abs(best.midi-midi)?s:best,SAMPLES[0]);
}
function playSample(midi,start,dur,vol){
  const s=nearestSample(midi),buf=sampleBuffers.get(s.midi);
  if(!buf)return;
  const src=ctx.createBufferSource(),g=ctx.createGain();
  src.buffer=buf;src.playbackRate.value=Math.pow(2,(midi-s.midi)/12);
  const t=Math.max(ctx.currentTime,start);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.03,vol),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(.12,dur));
  src.connect(g);g.connect(master);src.start(t);src.stop(t+dur+.08);
  activeSources.push(src);
}
async function testPiano(){
  try{
    if(!audioEnabled)throw new Error("先に「音を有効にする」を押してください");
    if(!samplesReady)await loadSamples();
    playSample(60,ctx.currentTime+.03,.6,.6);
    playSample(64,ctx.currentTime+.05,.6,.55);
    playSample(67,ctx.currentTime+.07,.6,.55);
    $("status").textContent="ピアノ音テスト";
  }catch(e){$("error").textContent=e.message;}
}

function parseChord(s){
  s=s.trim().replace(/♭/g,"b").replace(/♯/g,"#");
  const m=s.match(/^([A-Ga-g])([#b]?)(.*)$/);if(!m)throw new Error("コードを読めません: "+s);
  const root=(m[1].toUpperCase()+m[2]).toUpperCase();if(!(root in N))throw new Error("コードを読めません: "+s);
  const suffix=m[3].trim().replace(/^M7$/,"maj7");
  for(const [r,ints] of TYPES)if(r.test(suffix))return{symbol:s,root:N[root],ints};
  throw new Error("未対応コード: "+s);
}
function parseChordSeq(text,defBeats){return text.replace(/\n/g," | ").split(/\s*\|\s*|\s+/).filter(Boolean).map(tok=>{let b=defBeats;const m=tok.match(/^(.*?):(\d*\.?\d+)$/);if(m){tok=m[1];b=Number(m[2])}return{...parseChord(tok),beats:b}})}
function parseMelody(text){return text.replace(/\n/g," ").replace(/\|/g," ").split(/\s+/).filter(Boolean).map(tok=>{let b=1;const x=tok.match(/^(.*?):(\d*\.?\d+)$/);if(x){tok=x[1];b=Number(x[2])}if(/^R$/i.test(tok))return{symbol:"R",rest:true,beats:b};const m=tok.match(/^([A-Ga-g])([#b]?)(-?\d)$/);if(!m)throw new Error("音を読めません: "+tok);const name=(m[1].toUpperCase()+m[2]).toUpperCase();return{symbol:tok,rest:false,beats:b,midi:12*(Number(m[3])+1)+N[name]}})}
function candidateVoicings(ch){const raw=ch.ints.map(i=>60+ch.root+i),out=[];for(let inv=0;inv<raw.length;inv++){let v=raw.slice();for(let i=0;i<inv;i++)v[i]+=12;v=v.sort((a,b)=>a-b);[-12,0,12].forEach(sh=>out.push(v.map(n=>n+sh)))}return out.filter(v=>Math.min(...v)>=45&&Math.max(...v)<=76)}
function chooseVoicing(ch){const c=candidateVoicings(ch);if(!lastVoicing){lastVoicing=c[0].slice();return c[0]}const score=v=>v.reduce((s,n,i)=>s+Math.abs(n-(lastVoicing[i]??n)),0);const x=c.sort((a,b)=>score(a)-score(b))[0];lastVoicing=x.slice();return x}
function scheduleChord(ch,start,dur,beatSec,style,feel){const notes=chooseVoicing(ch);if(style==="block"){notes.forEach((m,i)=>playSample(m,start+i*.01,dur*.85,.48));return;}let t=0,i=0;while(t<dur-.03){let step=style==="arp"?beatSec/2:beatSec;if(feel==="swing"&&style==="arp")step=(i%2===0)?beatSec*2/3:beatSec/3;if(style==="piano"){playSample(48+ch.root,start+t,Math.min(.7,step*.8),.45);notes.forEach((m,j)=>playSample(m,start+t+beatSec*.5+j*.01,Math.min(.32,beatSec*.3),.32));}else playSample(notes[i%notes.length],start+t,Math.min(.4,step*.8),.45);t+=step;i++;}}

function stopAll(){
  token++;timers.forEach(clearTimeout);timers=[];
  activeSources.splice(0).forEach(s=>{try{s.stop()}catch(e){}});
  $("nowChord").textContent="—";$("nowMelody").textContent="—";$("status").textContent="停止中";lastVoicing=null;
}
async function startPlayback(){
  stopAll();$("error").textContent="";
  const myToken=token;
  try{
    if(!audioEnabled)throw new Error("先に「音を有効にする」を押してください");
    if(!samplesReady)await loadSamples();
    const bpm=Number($("bpm").value),beatSec=60/bpm,start=ctx.currentTime+.08,style=$("style").value,feel=$("feel").value;
    let maxSec=0;
    if($("playChords").checked){let p=0;for(const ch of parseChordSeq($("chords").value,Number($("beats").value))){const d=ch.beats*beatSec;scheduleChord(ch,start+p,d,beatSec,style,feel);timers.push(setTimeout(()=>{if(token===myToken)$("nowChord").textContent=ch.symbol},p*1000));p+=d;}maxSec=Math.max(maxSec,p);}
    if($("playMelody").checked){let p=0;for(const n of parseMelody($("melody").value)){const d=n.beats*beatSec;if(!n.rest)playSample(n.midi,start+p,d*.78,.62);timers.push(setTimeout(()=>{if(token===myToken)$("nowMelody").textContent=n.rest?"休符":n.symbol},p*1000));p+=d;}maxSec=Math.max(maxSec,p);}
    $("status").textContent="再生中";
    timers.push(setTimeout(()=>{if(token!==myToken)return;if($("loop").checked)startPlayback();else $("status").textContent="再生終了"},(maxSec+.2)*1000));
  }catch(e){$("error").textContent=e.stack||e.message;log("再生エラー: "+e.message);}
}

window.addEventListener("error",e=>log("JS error: "+e.message));
log("JavaScript初期化完了");
</script>
</body>
</html>
